! =====================================================================
! GOIERRI ESKOLA - 1T JATETXEA (PACKET TRACER)
! 3. SW-RACK (Cisco 2960-24TT) - Gelako Rack-eko Switch Nagusia
! =====================================================================
enable
configure terminal
hostname SW-RACK
no ip domain-lookup

vlan 10
 name LAN
exit
vlan 20
 name DMZ
exit
vlan 30
 name WAN_GOIERRI
exit

! LAN (VLAN 10): Fa0/1 (OPNsense LAN), Fa0/2 (WinServer 2025), Fa0/3-6 (libre)
interface range FastEthernet0/1 - 6
 description VLAN10-LAN
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
exit

! DMZ (VLAN 20): Fa0/7 (OPNsense OPT1), Fa0/8 (Ubuntu DMZ), Fa0/9-12 (libre)
interface range FastEthernet0/7 - 12
 description VLAN20-DMZ
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
exit

! WAN (VLAN 30): Fa0/13 (OPNsense WAN), Fa0/20 (Goierri Eskola Uplink)
interface range FastEthernet0/13 - 20
 description VLAN30-WAN-GOIERRI
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
exit

! Trunk portua Mahai Gaineko Switch-era (pareteko Ethernet kableatua)
interface GigabitEthernet0/1
 description TRUNK-SW-MAHAIA
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
 no shutdown
exit

end
write memory
