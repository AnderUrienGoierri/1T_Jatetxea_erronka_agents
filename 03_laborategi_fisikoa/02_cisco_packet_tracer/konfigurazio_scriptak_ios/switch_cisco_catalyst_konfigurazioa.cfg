! =====================================================================
! GOIERRI ESKOLA - 1T JATETXEA ERRORKA
! CISCO CATALYST 2960 SWITCH - OINARRIZKO ETA SEGURTASUN KONFIGURAZIOA
! =====================================================================

enable
configure terminal

! 1. Oinarrizko Ezarpenak eta Ostalari Izena
hostname SW-JATETXEA-CORE
no ip domain-lookup
service password-encryption
banner motd ^C
###############################################################
# KONTUZ! Sarbide baimendua bakarrik. 1T Jatetxea Sare Sistema #
# Zibersegurtasuneko Laborategia - Goierri Eskola             #
###############################################################
^C

! 2. VLAN-en Sorkuntza eta Izenak
vlan 10
 name LAN_JATETXEA
 exit

vlan 20
 name DMZ_WEB_PUBLIKOA
 exit

vlan 30
 name WIFI_BEZEROAK_GUEST
 exit

vlan 99
 name KUDEAKETA_MGMT
 exit

vlan 999
 name ZABOR_VLAN_UNUSED
 exit

! 3. Trunk Portua Router/OPNsenserantz (GigabitEthernet 0/1)
interface GigabitEthernet0/1
 description UPLINK-TRUNK-OPNSENSE
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,99
 switchport nonegotiate
 no shutdown
 exit

! 4. LAN Portuak (WinServer2025, TPV, KDS, Inprimagailua: Fa0/1 - Fa0/8)
interface range FastEthernet0/1 - 8
 description LAN-BARNE-ZERBITZUAK
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 ! Port Security aktibatu
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 no shutdown
 exit

! 5. DMZ Portuak (Ubuntu Web Zerbitzaria: Fa0/9 - Fa0/16)
interface range FastEthernet0/9 - 16
 description DMZ-APACHE-WEB
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 no shutdown
 exit

! 6. WiFi Access Point Portua (Fa0/17 - Fa0/18: Multi-SSID Trunk)
interface range FastEthernet0/17 - 18
 description TRUNK-WIFI-ACCESS-POINT
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,30
 switchport nonegotiate
 spanning-tree portfast trunk
 no shutdown
 exit

! 7. Kudeaketa Portua (Admin PC: Fa0/24)
interface FastEthernet0/24
 description ADMIN-MGMT-PORT
 switchport mode access
 switchport access vlan 99
 spanning-tree portfast
 no shutdown
 exit

! 8. Erabili gabeko portuak itzali (Segurtasun Jardunbide Egokia)
interface range FastEthernet0/19 - 23, GigabitEthernet0/2
 description ITZALITA-ERABILI-GABEA
 switchport mode access
 switchport access vlan 999
 shutdown
 exit

! 9. Switch-aren Kudeaketa IPa (SVI VLAN 99)
interface vlan 99
 description INTERFAZE-KUDEAKETA-SVI
 ip address 192.168.99.2 255.255.255.0
 no shutdown
 exit

ip default-gateway 192.168.99.1

! 10. DHCP Snooping aktibatzea
ip dhcp snooping
ip dhcp snooping vlan 10,20,30
interface GigabitEthernet0/1
 ip dhcp snooping trust
 exit

! 11. Konfigurazioa Gorde
end
write memory
