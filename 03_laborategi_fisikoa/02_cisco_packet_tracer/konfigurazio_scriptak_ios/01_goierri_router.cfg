! =====================================================================
! GOIERRI ESKOLA - 1T JATETXEA (PACKET TRACER)
! 1. GOIERRI-ROUTER (Cisco 2911) - Eskolako Sare Nagusia (WAN DHCP)
! =====================================================================
enable
configure terminal
hostname GOIERRI-ESKOLA-GW
no ip domain-lookup

! Goierri Eskolako VLAN 30 (WAN) pasabidea -> SW-RACK Fa0/20
interface GigabitEthernet0/0
 description UPLINK-GELAKO-RACK-SW
 ip address 192.168.115.254 255.255.255.0
 no shutdown
exit

! Internet simulazioa -> Internet Server (8.8.8.8)
interface GigabitEthernet0/1
 description INTERNET-SIMULAZIOA
 ip address 8.8.8.1 255.255.255.0
 no shutdown
exit

! DHCP Zerbitzaria 192.168.115.0/24 sarearentzat (OPNsense WAN + WAN bezeroak)
ip dhcp excluded-address 192.168.115.1 192.168.115.150
ip dhcp excluded-address 192.168.115.159
ip dhcp excluded-address 192.168.115.254
ip dhcp pool GOIERRI_WAN
 network 192.168.115.0 255.255.255.0
 default-router 192.168.115.254
 dns-server 8.8.8.8
exit

end
write memory
