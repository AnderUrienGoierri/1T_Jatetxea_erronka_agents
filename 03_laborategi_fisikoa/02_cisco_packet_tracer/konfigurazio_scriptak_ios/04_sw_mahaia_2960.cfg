! =====================================================================
! GOIERRI ESKOLA - 1T JATETXEA (PACKET TRACER)
! 4. SW-MAHAIA (Cisco 2960-24TT) - Mahai Gaineko Switch-a (SG200-50)
! =====================================================================
enable
configure terminal
hostname SW-MAHAIA
no ip domain-lookup

vlan 10
 name LAN
exit
vlan 20
 name DMZ
exit
vlan 30
 name WAN_GOIERRI
exit

! LAN (VLAN 10): Fa0/1 (Admin Portatila), Fa0/2-6 (Taldekideak)
interface range FastEthernet0/1 - 6
 description VLAN10-LAN-MAHAIA
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
exit

! DMZ (VLAN 20): Fa0/7-12 (erreserban)
interface range FastEthernet0/7 - 12
 description VLAN20-DMZ-MAHAIA
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
exit

! WAN (VLAN 30): Fa0/13-20 (Eskolako sareko bezeroak / proba)
interface range FastEthernet0/13 - 20
 description VLAN30-WAN-MAHAIA
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
exit

! Trunk portua Gelako Rack-eko Switch-era (pareteko Ethernet hartunea)
interface GigabitEthernet0/1
 description TRUNK-SW-RACK
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
 no shutdown
exit

end
write memory
