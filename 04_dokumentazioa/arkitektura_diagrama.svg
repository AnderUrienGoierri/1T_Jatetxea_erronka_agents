<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="100%" height="auto" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- Background container -->
  <rect width="800" height="620" fill="#fafafa" rx="12" stroke="#e0e0e0" />

  <!-- SECTION 1: KANPOKOAK (Bezeroak) -->
  <rect x="25" y="25" width="350" height="120" rx="8" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5" />
  <text x="40" y="48" font-size="13" font-weight="bold" fill="#0d47a1">1. BEZEROAK</text>
  
  <rect x="40" y="60" width="150" height="70" rx="6" fill="#ffffff" stroke="#bbdefb" filter="url(#shadow)" />
  <text x="115" y="85" font-size="12" font-weight="bold" fill="#1565c0" text-anchor="middle">Web Karta &amp; Erreserbak</text>
  <text x="115" y="102" font-size="11" fill="#546e7a" text-anchor="middle">web_php (HTML/JS)</text>

  <rect x="205" y="60" width="155" height="70" rx="6" fill="#ffffff" stroke="#bbdefb" filter="url(#shadow)" />
  <text x="282" y="85" font-size="12" font-weight="bold" fill="#1565c0" text-anchor="middle">Bezeroaren Mugikorra</text>
  <text x="282" y="102" font-size="11" fill="#546e7a" text-anchor="middle">mobile_bezeroa (Flutter)</text>

  <!-- SECTION 2: JANTOKIA & BARRA -->
  <rect x="425" y="25" width="350" height="120" rx="8" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5" />
  <text x="440" y="48" font-size="13" font-weight="bold" fill="#1b5e20">2. ZERBITZARIAK ETA BARRA</text>

  <rect x="440" y="60" width="155" height="70" rx="6" fill="#ffffff" stroke="#c8e6c9" filter="url(#shadow)" />
  <text x="517" y="85" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="middle">Android Komandera</text>
  <text x="517" y="102" font-size="11" fill="#546e7a" text-anchor="middle">zerbitzaria_komandera (Compose)</text>

  <rect x="610" y="60" width="150" height="70" rx="6" fill="#ffffff" stroke="#c8e6c9" filter="url(#shadow)" />
  <text x="685" y="85" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="middle">TPV Kutxa Zentrala</text>
  <text x="685" y="102" font-size="11" fill="#546e7a" text-anchor="middle">desktop_csharp (.NET 10)</text>

  <!-- SECTION 3: SUKALDEA & BILTEGIA -->
  <rect x="25" y="475" width="350" height="120" rx="8" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.5" />
  <text x="40" y="498" font-size="13" font-weight="bold" fill="#e65100">3. SUKALDEA ETA BILTEGIA</text>

  <rect x="40" y="510" width="150" height="70" rx="6" fill="#ffffff" stroke="#ffe0b2" filter="url(#shadow)" />
  <text x="115" y="535" font-size="12" font-weight="bold" fill="#ef6c00" text-anchor="middle">Sukaldeko Telebista</text>
  <text x="115" y="552" font-size="11" fill="#546e7a" text-anchor="middle">sukaldea_kds_android_tv</text>

  <rect x="205" y="510" width="155" height="70" rx="6" fill="#ffffff" stroke="#ffe0b2" filter="url(#shadow)" />
  <text x="282" y="535" font-size="12" font-weight="bold" fill="#ef6c00" text-anchor="middle">KDS &amp; Biltegi Desktop</text>
  <text x="282" y="552" font-size="11" fill="#546e7a" text-anchor="middle">desktop_javafx (Java 21)</text>

  <!-- SECTION 4: ADMIN & ERP -->
  <rect x="425" y="475" width="350" height="120" rx="8" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1.5" />
  <text x="440" y="498" font-size="13" font-weight="bold" fill="#4a148c">4. KUDEAKETA ETA ADMIN TI</text>

  <rect x="440" y="510" width="155" height="70" rx="6" fill="#ffffff" stroke="#e1bee7" filter="url(#shadow)" />
  <text x="517" y="535" font-size="12" font-weight="bold" fill="#6a1b9a" text-anchor="middle">Admin IT Panela</text>
  <text x="517" y="552" font-size="11" fill="#546e7a" text-anchor="middle">admin_IT_zentrala (Web)</text>

  <rect x="610" y="510" width="150" height="70" rx="6" fill="#ffffff" stroke="#e1bee7" filter="url(#shadow)" />
  <text x="685" y="535" font-size="12" font-weight="bold" fill="#6a1b9a" text-anchor="middle">Odoo ERP</text>
  <text x="685" y="552" font-size="11" fill="#546e7a" text-anchor="middle">odoo_erp (Kontabilitatea/Stock)</text>

  <!-- CENTER: BACKEND REST API -->
  <rect x="260" y="210" width="280" height="90" rx="10" fill="#1565c0" stroke="#0d47a1" stroke-width="2" filter="url(#shadow)" />
  <text x="400" y="243" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">REST API Zentrala</text>
  <text x="400" y="265" font-size="12" fill="#e3f2fd" text-anchor="middle">ASP.NET Core (backend_api)</text>
  <text x="400" y="283" font-size="11" fill="#bbdefb" text-anchor="middle">Port 5050 / HTTPS</text>

  <!-- CENTER: POSTGRESQL DB -->
  <rect x="290" y="340" width="220" height="75" rx="8" fill="#37474f" stroke="#263238" stroke-width="2" filter="url(#shadow)" />
  <text x="400" y="370" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">PostgreSQL Datu-Basea</text>
  <text x="400" y="392" font-size="11" fill="#cfd8dc" text-anchor="middle">Eredu Erlazionala &amp; Transakzioak</text>

  <!-- CONNECTION LINES & ARROWS -->
  <!-- API <-> DB -->
  <line x1="400" y1="300" x2="400" y2="340" stroke="#37474f" stroke-width="3" />

  <!-- Bezeroak -> API -->
  <path d="M 200 145 L 200 235 L 260 235" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Zerbitzariak -> API -->
  <path d="M 600 145 L 600 235 L 540 235" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Sukaldea & Biltegia -> API -->
  <path d="M 200 475 L 200 275 L 260 275" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Admin & ERP -> API -->
  <path d="M 600 475 L 600 275 L 540 275" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)" />

</svg>