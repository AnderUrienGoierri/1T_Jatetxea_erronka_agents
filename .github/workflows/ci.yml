name: CI - 1T Jatetxea DevSecOps eta Kalitate Kontrolak

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-secrets-and-commits:
    name: DevSecOps - Isilpeko Datuak eta Komit Estandarrak
    runs-on: ubuntu-latest
    steps:
      - name: Kodea Eskuratu
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Isilpeko Datuen Eskaneatzea (Zero Secret Leakage)
        run: |
          echo "Isilpeko datuen eskaneatze azkarra martxan..."
          SUSPICIOUS=$(git grep -EIi '(password\s*=\s*["'\''][^"'\'']+["'\'']|api_key\s*=\s*["'\''][^"'\'']+["'\'']|BEGIN PRIVATE KEY)' -- ':!*.sample' ':!*.example' ':!*appsettings.json' ':!*.md' ':!.github/**' || true)
          if [ -n "$SUSPICIOUS" ]; then
            echo "KONTUZ: Isilpeko datu arriskutsuak detektatu dira kodean:"
            echo "$SUSPICIOUS"
            exit 1
          fi
          echo "Segurtasun-eskaneatzea ondo igaro da: ez da isilpeko gakorik aurkitu."

      - name: Zero Emoji Egiaztapena Komitetan
        run: |
          echo "Komit mezuetan emojirik ez dagoela egiaztatzen..."
          python3 -c '
          import subprocess, re, sys
          out = subprocess.check_output(["git", "log", "-n", "10", "--format=%s"], text=True)
          emojis = re.findall(r"[\U00010000-\U0010ffff\u2600-\u26ff\u2700-\u27bf]", out)
          if emojis:
              print(f"ERROREA: Emojidun komit mezua detektatu da: {emojis}")
              sys.exit(1)
          print("Komit mezuak garbi daude: zero emoji.")
          '

  backend-api-check:
    name: Backend REST API (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Kodea Eskuratu
        uses: actions/checkout@v4

      - name: Ezarri .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: REST API Konpilatu
        run: |
          dotnet restore "01_aplikazioak/backend_rest_api_csharp/Jatetxea.Api.csproj"
          dotnet build "01_aplikazioak/backend_rest_api_csharp/Jatetxea.Api.csproj" -c Release --no-restore

  admin-it-zentrala-check:
    name: Admin IT Zentrala Zerbitzaria (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Kodea Eskuratu
        uses: actions/checkout@v4

      - name: Ezarri .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Admin IT Zerbitzaria Konpilatu
        run: |
          dotnet restore "01_aplikazioak/admin/admin_IT_zentrala/server/Jatetxea.AdminZentrala/Jatetxea.AdminZentrala.csproj"
          dotnet build "01_aplikazioak/admin/admin_IT_zentrala/server/Jatetxea.AdminZentrala/Jatetxea.AdminZentrala.csproj" -c Release --no-restore

      - name: wwwroot Baliabideen Osotasuna Egiaztatu
        run: |
          test -f "01_aplikazioak/admin/admin_IT_zentrala/server/Jatetxea.AdminZentrala/wwwroot/index.html" || exit 1
          echo "wwwroot/index.html fitxategia existitzen da eta osorik dago."

  admin-javafx-check:
    name: Admin JavaFX Kudeaketa Desktop (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Kodea Eskuratu
        uses: actions/checkout@v4

      - name: Ezarri Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Maven Probak
        run: |
          cd 01_aplikazioak/admin/admin_desktop_java/admin_desktop_java
          mvn -B test

  desktop-csharp-check:
    name: Desktop C# Windows Forms (.NET 10)
    runs-on: windows-latest
    steps:
      - name: Kodea Eskuratu
        uses: actions/checkout@v4

      - name: Ezarri .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: C# TPV Proiektua Konpilatu
        shell: pwsh
        run: |
          dotnet restore "01_aplikazioak/desktop_csharp/Jatetxea.Desktop.csproj"
          dotnet build "01_aplikazioak/desktop_csharp/Jatetxea.Desktop.csproj" -c Release --no-restore

  javafx-kds-check:
    name: Desktop JavaFX KDS (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Kodea Eskuratu
        uses: actions/checkout@v4

      - name: Ezarri Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Egiaztatu FXML Fitxategiak (XML Sintaxia)
        run: |
          echo "FXML fitxategiak baliozkotzen..."
          for fxml in $(find 01_aplikazioak/desktop_javafx -name "*.fxml"); do
            echo "Baliozkotzen: $fxml"
            xmlstarlet val "$fxml" 2>/dev/null || xmllint --noout "$fxml" 2>/dev/null || python3 -c "import xml.etree.ElementTree as ET; ET.parse('$fxml')"
          done

      - name: Maven Konpilazioa
        run: |
          cd 01_aplikazioak/desktop_javafx
          mvn -B compile test-compile

  web-php-check:
    name: Web PHP Frontend (PHP 8.4)
    runs-on: ubuntu-latest
    steps:
      - name: Kodea Eskuratu
        uses: actions/checkout@v4

      - name: Ezarri PHP Ingurunea
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Lint PHP Fitxategiak
        run: |
          find 01_aplikazioak/web_php -name "*.php" -print0 | xargs -0 -n1 php -l
