name: CI - 1T Jatetxea DevSecOps eta Kalitate Kontrolak

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-secrets-and-commits:
    name: DevSecOps - Isilpeko Datuak eta Komit Estandarrak
    runs-on: ubuntu-latest
    steps:
      - name: Kodea Eskuratu
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Isilpeko Datuen Eskaneatzea (Zero Secret Leakage)
        run: |
          echo "Isilpeko datuen eskaneatze azkarra martxan..."
          SUSPICIOUS=$(git grep -EIi '(password\s*=\s*["'\''][^"'\'']+["'\'']|api_key\s*=\s*["'\''][^"'\'']+["'\'']|BEGIN PRIVATE KEY)' -- ':!*.sample' ':!*.example' ':!*appsettings.json' ':!*.md' || true)
          if [ -n "$SUSPICIOUS" ]; then
            echo "KONTUZ: Isilpeko datu arriskutsuak detektatu dira kodean:"
            echo "$SUSPICIOUS"
            exit 1
          fi
          echo "Segurtasun-eskaneatzea ondo igaro da: ez da isilpeko gakorik aurkitu."

      - name: Zero Emoji Egiaztapena Komitetan
        run: |
          echo "Komit mezuetan emojirik ez dagoela egiaztatzen..."
          # Egiaztatu azken komit mezuak
          EMOJI_FOUND=$(git log -n 10 --format="%s" | grep -P "[\x{1F300}-\x{1FAD6}\x{1F600}-\x{1F64F}\x{1F680}-\x{1F6FF}\x{2600}-\x{26FF}\x{2700}-\x{27BF}]" || true)
          if [ -n "$EMOJI_FOUND" ]; then
            echo "ERROREA: Emojidun komit mezua detektatu da:"
            echo "$EMOJI_FOUND"
            echo "Proiektu honetan emojien erabilera erabat debekatuta dago."
            exit 1
          fi
          echo "Komit mezuak garbi daude."

  backend-api-check:
    name: Backend REST API (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Kodea Eskuratu
        uses: actions/checkout@v4

      - name: Ezarri .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: REST API Konpilatu
        run: |
          dotnet restore "01_aplikazioak/backend_api/Jatetxea.Api.csproj"
          dotnet build "01_aplikazioak/backend_api/Jatetxea.Api.csproj" -c Release --no-restore

  admin-it-zentrala-check:
    name: Admin IT Zentrala Zerbitzaria (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Kodea Eskuratu
        uses: actions/checkout@v4

      - name: Ezarri .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Admin IT Zerbitzaria Konpilatu
        run: |
          dotnet restore "01_aplikazioak/admin_IT_zentrala/server/Jatetxea.AdminZentrala/Jatetxea.AdminZentrala.csproj"
          dotnet build "01_aplikazioak/admin_IT_zentrala/server/Jatetxea.AdminZentrala/Jatetxea.AdminZentrala.csproj" -c Release --no-restore

      - name: wwwroot Baliabideen Osotasuna Egiaztatu
        run: |
          test -f "01_aplikazioak/admin_IT_zentrala/server/Jatetxea.AdminZentrala/wwwroot/index.html" || exit 1
          echo "wwwroot/index.html fitxategia existitzen da eta osorik dago."

  desktop-csharp-check:
    name: Desktop C# Windows Forms (.NET 10)
    runs-on: windows-latest
    steps:
      - name: Kodea Eskuratu
        uses: actions/checkout@v4

      - name: Ezarri .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: C# TPV Proiektua Konpilatu
        shell: pwsh
        run: |
          dotnet restore "01_aplikazioak/desktop_csharp/Jatetxea.Desktop.csproj"
          dotnet build "01_aplikazioak/desktop_csharp/Jatetxea.Desktop.csproj" -c Release --no-restore

  javafx-kds-check:
    name: Desktop JavaFX KDS (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Kodea Eskuratu
        uses: actions/checkout@v4

      - name: Ezarri Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Egiaztatu FXML Fitxategiak (XML Sintaxia)
        run: |
          echo "FXML fitxategiak baliozkotzen..."
          for fxml in $(find 01_aplikazioak/desktop_javafx -name "*.fxml"); do
            echo "Baliozkotzen: $fxml"
            xmlstarlet val "$fxml" 2>/dev/null || xmllint --noout "$fxml" 2>/dev/null || python3 -c "import xml.etree.ElementTree as ET; ET.parse('$fxml')"
          done

      - name: Maven Konpilazioa
        run: |
          cd 01_aplikazioak/desktop_javafx
          mvn -B compile test-compile

  web-php-check:
    name: Web PHP Frontend (PHP 8.2)
    runs-on: ubuntu-latest
    steps:
      - name: Kodea Eskuratu
        uses: actions/checkout@v4

      - name: Ezarri PHP Ingurunea
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP Fitxategiak
        run: |
          find 01_aplikazioak/web_php -name "*.php" -print0 | xargs -0 -n1 php -l
