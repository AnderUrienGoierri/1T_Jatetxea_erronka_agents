<!doctype html>
<html lang="eu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sukaldea KDS - Android TV Pantaila</title>
    <style>
      :root {
        --bg: #0f172a;
        --card-bg: #1e293b;
        --border: #334155;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --accent: #e11d48;
        --warning: #f59e0b;
        --success: #10b981;
        --info: #3b82f6;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        padding: 16px;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        touch-action: manipulation;
        user-select: none;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 12px;
        border-bottom: 2px solid var(--border);
        margin-bottom: 16px;
      }
      .header-title {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .badge {
        background: var(--accent);
        color: white;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 700;
      }
      .header-info {
        display: flex;
        align-items: center;
        gap: 24px;
        font-size: 20px;
        color: var(--text-muted);
      }
      .status-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--success);
        display: inline-block;
        margin-right: 6px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        flex: 1;
        overflow: hidden;
      }
      .column {
        background: rgba(30, 41, 59, 0.5);
        border: 1px solid var(--border);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .column-header {
        padding: 12px 16px;
        font-size: 18px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid var(--border);
      }
      .col-zai .column-header {
        background: #374151;
        color: #f3f4f6;
      }
      .col-martxan .column-header {
        background: #854d0e;
        color: #fef08a;
      }
      .col-prest .column-header {
        background: #065f46;
        color: #a7f3d0;
      }
      .card-list {
        padding: 12px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 1;
      }
      .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        transition:
          border-color 0.2s,
          transform 0.1s;
      }
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        padding-bottom: 6px;
        border-bottom: 1px dashed var(--border);
      }
      .card-table {
        font-size: 22px;
        font-weight: 800;
        color: #38bdf8;
      }
      .card-time {
        font-size: 14px;
        color: var(--text-muted);
      }
      .dish-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .dish-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 10px;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--border);
        border-radius: 6px;
        cursor: pointer;
        touch-action: manipulation;
      }
      .dish-row:active {
        background: rgba(59, 130, 246, 0.2);
      }
      .dish-row.is-done {
        border-color: #059669;
        opacity: 0.75;
      }
      .dish-info {
        display: flex;
        flex-direction: column;
      }
      .dish-item {
        display: flex;
        align-items: center;
        font-size: 17px;
        font-weight: 600;
      }
      .dish-qty {
        background: #0284c7;
        color: white;
        padding: 2px 8px;
        border-radius: 4px;
        margin-right: 8px;
        font-size: 15px;
      }
      .dish-notes {
        font-size: 13px;
        color: #facc15;
        font-style: italic;
        margin-top: 3px;
      }
      .dish-btn {
        padding: 6px 12px;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        touch-action: manipulation;
        min-height: 38px;
      }
      .dish-btn-zai {
        background: #d97706;
        color: white;
      }
      .dish-btn-martxan {
        background: #059669;
        color: white;
      }
      .dish-btn-done {
        background: #334155;
        color: #94a3b8;
      }
      .order-actions {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .btn-action {
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        min-height: 40px;
        touch-action: manipulation;
      }
      .btn-start {
        background: #d97706;
        color: white;
      }
      .btn-complete {
        background: #10b981;
        color: white;
      }
      .empty-state {
        padding: 24px;
        text-align: center;
        color: var(--text-muted);
        font-size: 15px;
      }
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 8px;
        font-size: 13px;
        color: var(--text-muted);
        border-top: 1px solid var(--border);
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-title">
        <span>JATETXEA KDS</span>
        <span class="badge">SUKALDEA TV</span>
      </div>
      <div class="header-info">
        <div>
          <span class="status-dot" id="statusDot"></span
          ><span id="statusText">Konektatzen...</span>
        </div>
        <div id="liveClock">00:00:00</div>
      </div>
    </header>

    <div
      id="dbAlertBanner"
      style="
        display: none;
        background: #991b1b;
        color: #ffffff;
        padding: 10px 16px;
        border-radius: 8px;
        margin-bottom: 14px;
        font-weight: 700;
        font-size: 15px;
        text-align: center;
        border: 1px solid #ef4444;
      "
    ></div>

    <main class="grid">
      <div class="column col-zai">
        <div class="column-header">
          <span>Zai daudenak</span>
          <span id="countZai">0</span>
        </div>
        <div class="card-list" id="listZai"></div>
      </div>

      <div class="column col-martxan">
        <div class="column-header">
          <span>Sukaldean Martxan</span>
          <span id="countMartxan">0</span>
        </div>
        <div class="card-list" id="listMartxan"></div>
      </div>

      <div class="column col-prest">
        <div class="column-header">
          <span>Prestatuta (Ateratzeko)</span>
          <span id="countPrest">0</span>
        </div>
        <div class="card-list" id="listPrest"></div>
      </div>
    </main>

    <footer>
      <span
        >Sukaldea KDS · Philips 32BDL3751T Pantaila Taktila (Full HD · Android
        13) | Sakatu plateretan egoera aldatzeko</span
      >
      <span id="apiEndpointText">API: Bilatzen...</span>
    </footer>

    <script>
      function updateClock() {
        const now = new Date();
        document.getElementById("liveClock").textContent =
          now.toLocaleTimeString("eu-ES");
      }
      setInterval(updateClock, 1000);
      updateClock();

      let currentApiBase = null;

      function getElapsedTime(dateStr) {
        if (!dateStr) return "";
        const orderDate = new Date(dateStr.replace(" ", "T"));
        const now = new Date();
        const diffMs = now - orderDate;
        const diffMins = Math.floor(diffMs / 60000);
        if (isNaN(diffMins) || diffMins < 0)
          return dateStr.substring(11, 16) || "";
        if (diffMins === 0) return "Oraintxe";
        if (diffMins === 1) return "Duela min 1";
        return `Duela ${diffMins} min`;
      }

      function createOrderCardHtml(order) {
        const lerroak = order.lerroak || [];
        const guztiaEginda =
          lerroak.length > 0 &&
          lerroak.every(
            (l) => l.egoera === "Prestatua" || l.egoera === "Zerbitzatua",
          );
        const mahaiaIzena = order.mahaiZenbakia
          ? `Mahaia ${order.mahaiZenbakia}`
          : order.mahaia || `Eskaera #${order.id}`;
        const denbora = getElapsedTime(order.sortzeData || order.sortze_data);

        return `
        <div class="card" id="order-card-${order.id}">
          <div class="card-header">
            <div>
              <span class="card-table">${mahaiaIzena}</span>
              <span style="font-size:12px; color:var(--text-muted); margin-left:8px;">#${order.id} (${order.langileIzena || "Zerbitzaria"})</span>
            </div>
            <span class="card-time">${denbora}</span>
          </div>
          <ul class="dish-list">
            ${lerroak
              .map((l) => {
                const isPrestatua =
                  l.egoera === "Prestatua" || l.egoera === "Zerbitzatua";
                const isSukaldean = l.egoera === "Sukaldean";
                let btnClass = "dish-btn-zai";
                let btnText = "Sukaldera";
                let hurrengoEgoera = "Sukaldean";

                if (isSukaldean) {
                  btnClass = "dish-btn-martxan";
                  btnText = "Prestatuta";
                  hurrengoEgoera = "Prestatua";
                } else if (isPrestatua) {
                  btnClass = "dish-btn-done";
                  btnText = "✓ Eginda";
                  hurrengoEgoera = "Sukaldean";
                }

                return `
                <li class="dish-row ${isPrestatua ? "is-done" : ""}">
                  <div class="dish-info">
                    <div class="dish-item">
                      <span class="dish-qty">${l.kantitatea || 1}x</span>
                      <span>${l.platerIzena || l.plater_izena || "Platera"}</span>
                    </div>
                    ${l.oharrak ? `<div class="dish-notes">📝 ${l.oharrak}</div>` : ""}
                  </div>
                  <button class="dish-btn ${btnClass}" onclick="updateLineState(${l.id}, '${hurrengoEgoera}', event)">
                    ${btnText}
                  </button>
                </li>
              `;
              })
              .join("")}
          </ul>
          <div class="order-actions">
            ${
              order.egoera === "Irekia"
                ? `
              <button class="btn-action btn-start" onclick="updateOrderState(${order.id}, 'Sukaldean', event)">
                Sukaldera Bidali
              </button>
            `
                : ""
            }
            <button class="btn-action btn-complete" ${guztiaEginda ? 'disabled style="opacity:0.5;"' : ""} onclick="updateOrderState(${order.id}, 'Prestatua', event)">
              ${guztiaEginda ? "✓ Dena Prestatuta" : "Eskaera Osoa Eginda"}
            </button>
          </div>
        </div>
      `;
      }

      function renderOrders(orders) {
        // Filtratu soilik aktiboak (ez kobratuak, ez ezezatuak)
        const aktiboak = orders.filter(
          (o) =>
            o.egoera !== "Kobratua" &&
            o.egoera !== "Ezeztatua" &&
            o.ezabatua !== 1 &&
            o.ezabatua !== true,
        );

        // Kategoriak banatu lerroen/eskaeraren egoeraren arabera
        const zai = [];
        const martxan = [];
        const prest = [];

        aktiboak.forEach((order) => {
          const lerroak = order.lerroak || [];
          if (lerroak.length === 0) {
            if (order.egoera === "Sukaldean") martxan.push(order);
            else if (order.egoera === "Prestatua") prest.push(order);
            else zai.push(order);
            return;
          }

          const allDone = lerroak.every(
            (l) => l.egoera === "Prestatua" || l.egoera === "Zerbitzatua",
          );
          const anyMartxan = lerroak.some((l) => l.egoera === "Sukaldean");

          if (allDone || order.egoera === "Prestatua") {
            prest.push(order);
          } else if (anyMartxan || order.egoera === "Sukaldean") {
            martxan.push(order);
          } else {
            zai.push(order);
          }
        });

        document.getElementById("countZai").textContent = zai.length;
        document.getElementById("countMartxan").textContent = martxan.length;
        document.getElementById("countPrest").textContent = prest.length;

        document.getElementById("listZai").innerHTML = zai.length
          ? zai.map(createOrderCardHtml).join("")
          : '<div class="empty-state">Ez dago eskaerarik zai</div>';
        document.getElementById("listMartxan").innerHTML = martxan.length
          ? martxan.map(createOrderCardHtml).join("")
          : '<div class="empty-state">Ez dago eskaerarik martxan</div>';
        document.getElementById("listPrest").innerHTML = prest.length
          ? prest.map(createOrderCardHtml).join("")
          : '<div class="empty-state">Ez dago eskaerarik prestatuta</div>';
      }

      async function updateLineState(lineId, newEgoera, event) {
        if (event) event.stopPropagation();
        if (!currentApiBase) return;
        try {
          const res = await fetch(
            `${currentApiBase}/eskaerak/lerroak/${lineId}/egoera`,
            {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ egoera: newEgoera }),
            },
          );
          if (res.ok) {
            loadOrdersFromApi();
          } else {
            console.error("Errorea lerroa aldatzean", await res.text());
          }
        } catch (err) {
          console.error("Fetch errorea:", err);
        }
      }

      async function updateOrderState(orderId, newEgoera, event) {
        if (event) event.stopPropagation();
        if (!currentApiBase) return;
        try {
          if (newEgoera === "Sukaldean") {
            await fetch(`${currentApiBase}/eskaerak/${orderId}/sukaldera`, {
              method: "POST",
            });
          } else {
            await fetch(`${currentApiBase}/eskaerak/${orderId}/egoera`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ egoera: newEgoera }),
            });
          }
          loadOrdersFromApi();
        } catch (err) {
          console.error("Fetch errorea eskaera aldatzean:", err);
        }
      }

      async function loadOrdersFromApi() {
        const banner = document.getElementById("dbAlertBanner");
        const dot = document.getElementById("statusDot");
        const txt = document.getElementById("statusText");
        const apiHost = window.location.hostname || "localhost";

        // Posible API helbideak (5050 docker bidez, 5000 zuzenean)
        const candidates = [
          { base: `http://${apiHost}:5050/api/v1`, health: `http://${apiHost}:5050/health` },
          { base: `http://${apiHost}:5000/api/v1`, health: `http://${apiHost}:5000/health` }
        ];

        for (const cand of candidates) {
          try {
            // 1. Health egiaztatu: APIa eta DB egoera banatuta detektatzeko
            const healthRes = await fetch(cand.health, { cache: "no-store" });
            const isApiAlive = healthRes.status === 200 || healthRes.status === 503;

            if (isApiAlive) {
              currentApiBase = cand.base;
              document.getElementById("apiEndpointText").textContent = `API: ${cand.base}`;

              if (healthRes.status === 503) {
                // APIa piztuta dago, baina Datu-Basea deskonektatuta!
                dot.style.background = "var(--warning)";
                txt.textContent = "API martxan, datu basea deskonektatuta";
                if (banner) {
                  banner.style.display = "block";
                  banner.style.background = "#b45309";
                  banner.style.borderColor = "#f59e0b";
                  banner.textContent = "ADI: REST APIa martxan dago, baina MySQL datu-basea deskonektatuta dago!";
                }
                renderOrders([]);
                return;
              }

              // healthRes.status === 200 -> API eta DB biak martxan
              dot.style.background = "var(--success)";
              txt.textContent = "Konektatuta";
              if (banner) banner.style.display = "none";

              // Eskaerak kargatu
              const res = await fetch(`${cand.base}/eskaerak`, { cache: "no-store" });
              if (res.ok) {
                const json = await res.json();
                const list = json.dataList || json.valueList || json.data || [];

                // Xehetasunak (lerroak) kargatu eskaera bakoitzarentzat
                const fullOrders = await Promise.all(
                  list.map(async (item) => {
                    try {
                      const detailRes = await fetch(
                        `${cand.base}/eskaerak/${item.id}`,
                        { cache: "no-store" }
                      );
                      if (detailRes.ok) {
                        const detailJson = await detailRes.json();
                        return detailJson.data || item;
                      }
                    } catch (_) {}
                    return item;
                  })
                );

                renderOrders(fullOrders);
              }
              return;
            }
          } catch (e) {
            // Saiatu hurrengo portuarekin
          }
        }

        // APIra batere ezin bada konektatu
        dot.style.background = "var(--accent)";
        txt.textContent = "API Deskonektatuta";
        if (banner) {
          banner.style.display = "block";
          banner.style.background = "#991b1b";
          banner.style.borderColor = "#ef4444";
          banner.textContent =
            "OHARRA: REST API zerbitzariarekin ezin izan da konektatu (Portua 5050 / 5000). Egiaztatu martxan dagoela!";
        }
      }

      loadOrdersFromApi();
      setInterval(loadOrdersFromApi, 4000);
    </script>
  </body>
</html>
