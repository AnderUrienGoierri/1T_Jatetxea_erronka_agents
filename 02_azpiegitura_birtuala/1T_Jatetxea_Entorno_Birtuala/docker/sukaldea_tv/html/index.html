<!doctype html>
<html lang="eu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sukaldea KDS - Android TV Pantaila</title>
    <style>
      :root {
        --bg: #0f172a;
        --card-bg: #1e293b;
        --border: #334155;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --accent: #e11d48;
        --warning: #f59e0b;
        --success: #10b981;
        --info: #3b82f6;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        padding: 16px;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        touch-action: manipulation;
        user-select: none;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 12px;
        border-bottom: 2px solid var(--border);
        margin-bottom: 16px;
      }
      .header-title {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .badge {
        background: var(--accent);
        color: white;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 700;
      }
      .header-info {
        display: flex;
        align-items: center;
        gap: 24px;
        font-size: 20px;
        color: var(--text-muted);
      }
      .status-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--success);
        display: inline-block;
        margin-right: 6px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        flex: 1;
        overflow: hidden;
      }
      .column {
        background: rgba(30, 41, 59, 0.5);
        border: 1px solid var(--border);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .column-header {
        padding: 12px 16px;
        font-size: 18px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid var(--border);
      }
      .col-zai .column-header {
        background: #374151;
        color: #f3f4f6;
      }
      .col-martxan .column-header {
        background: #854d0e;
        color: #fef08a;
      }
      .col-prest .column-header {
        background: #065f46;
        color: #a7f3d0;
      }
      .card-list {
        padding: 12px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 1;
      }
      .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        transition:
          border-color 0.2s,
          transform 0.1s;
      }
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        padding-bottom: 6px;
        border-bottom: 1px dashed var(--border);
      }
      .card-table {
        font-size: 22px;
        font-weight: 800;
        color: #38bdf8;
      }
      .card-time {
        font-size: 14px;
        color: var(--text-muted);
      }
      .dish-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .dish-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 10px;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--border);
        border-radius: 6px;
        cursor: pointer;
        touch-action: manipulation;
      }
      .dish-row:active {
        background: rgba(59, 130, 246, 0.2);
      }
      .dish-row.is-done {
        border-color: #059669;
        opacity: 0.75;
      }
      .dish-info {
        display: flex;
        flex-direction: column;
      }
      .dish-item {
        display: flex;
        align-items: center;
        font-size: 17px;
        font-weight: 600;
      }
      .dish-qty {
        background: #0284c7;
        color: white;
        padding: 2px 8px;
        border-radius: 4px;
        margin-right: 8px;
        font-size: 15px;
      }
      .dish-notes {
        font-size: 13px;
        color: #facc15;
        font-style: italic;
        margin-top: 3px;
      }
      .dish-btn {
        padding: 6px 12px;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        touch-action: manipulation;
        min-height: 38px;
      }
      .dish-btn-zai {
        background: #d97706;
        color: white;
      }
      .dish-btn-martxan {
        background: #059669;
        color: white;
      }
      .dish-btn-done {
        background: #334155;
        color: #94a3b8;
      }
      .order-actions {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .btn-action {
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        min-height: 40px;
        touch-action: manipulation;
      }
      .btn-start {
        background: #d97706;
        color: white;
      }
      .btn-complete {
        background: #10b981;
        color: white;
      }
      .btn-serve {
        background: #0ea5e9;
        color: white;
      }
      .btn-serve:active {
        background: #0284c7;
      }
      .btn-delete {
        background: rgba(239, 68, 68, 0.2);
        color: #f87171;
        border: 1px solid #ef4444;
        padding: 8px 12px;
      }
      .btn-delete:hover,
      .btn-delete:active {
        background: #dc2626;
        color: white;
      }
      .btn-clear-all {
        background: #047857;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn-clear-all:hover {
        background: #059669;
      }
      .dish-name {
        cursor: pointer;
        transition: color 0.15s;
      }
      .dish-name:hover {
        color: #38bdf8;
        text-decoration: underline;
      }
      /* Modal Dialog for Ingredients */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(4px);
        z-index: 1000;
        justify-content: center;
        align-items: center;
      }
      .modal-overlay.active {
        display: flex;
      }
      .modal-content {
        background: #1e293b;
        border: 2px solid #3b82f6;
        border-radius: 12px;
        width: 90%;
        max-width: 520px;
        max-height: 85vh;
        overflow-y: auto;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        animation: modalIn 0.2s ease-out;
      }
      @keyframes modalIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 1px solid var(--border);
        padding-bottom: 12px;
      }
      .modal-title {
        font-size: 22px;
        font-weight: 800;
        color: #38bdf8;
      }
      .modal-badge {
        display: inline-block;
        font-size: 12px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 4px;
        background: #334155;
        color: #cbd5e1;
        margin-top: 4px;
      }
      .modal-close {
        background: #334155;
        color: #f8fafc;
        border: none;
        border-radius: 6px;
        font-size: 20px;
        width: 34px;
        height: 34px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .modal-close:hover {
        background: #ef4444;
      }
      .ingredient-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid var(--border);
        border-radius: 6px;
        margin-bottom: 6px;
      }
      .allergen-box {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid #ef4444;
        border-radius: 6px;
        padding: 8px 12px;
        color: #fca5a5;
        font-size: 14px;
        font-weight: 600;
      }
      .empty-state {
        padding: 24px;
        text-align: center;
        color: var(--text-muted);
        font-size: 15px;
      }
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 8px;
        font-size: 13px;
        color: var(--text-muted);
        border-top: 1px solid var(--border);
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-title">
        <span>JATETXEA KDS</span>
        <span class="badge">SUKALDEA TV</span>
      </div>
      <div class="header-info">
        <div>
          <span class="status-dot" id="statusDot"></span
          ><span id="statusText">Konektatzen...</span>
        </div>
        <div id="liveClock">00:00:00</div>
      </div>
    </header>

    <div
      id="dbAlertBanner"
      style="
        display: none;
        background: #991b1b;
        color: #ffffff;
        padding: 10px 16px;
        border-radius: 8px;
        margin-bottom: 14px;
        font-weight: 700;
        font-size: 15px;
        text-align: center;
        border: 1px solid #ef4444;
      "
    ></div>

    <main class="grid">
      <div class="column col-zai">
        <div class="column-header">
          <span>Zai daudenak</span>
          <span id="countZai">0</span>
        </div>
        <div class="card-list" id="listZai"></div>
      </div>

      <div class="column col-martxan">
        <div class="column-header">
          <span>Sukaldean Martxan</span>
          <span id="countMartxan">0</span>
        </div>
        <div class="card-list" id="listMartxan"></div>
      </div>

      <div class="column col-prest">
        <div class="column-header">
          <div style="display:flex; align-items:center; gap:8px;">
            <span>Prestatuta (Ateratzeko)</span>
            <span id="countPrest">0</span>
          </div>
          <button class="btn-clear-all" onclick="garbituPrestatutakoak(event)" title="Garbitu prestatutako eskaera guztiak">
            🧹 Garbitu
          </button>
        </div>
        <div class="card-list" id="listPrest"></div>
      </div>
    </main>

    <!-- Modal: Plateraren Osagaiak eta Alergenoak -->
    <div id="ingredientsModal" class="modal-overlay" onclick="itxiOsagaiakModal()">
      <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
          <div>
            <div id="modalDishTitle" class="modal-title">Plateraren Izena</div>
            <span id="modalDishCategory" class="modal-badge">Kategoria</span>
          </div>
          <button class="modal-close" onclick="itxiOsagaiakModal()" title="Itxi">&times;</button>
        </div>
        <p id="modalDishDesc" style="color:var(--text-muted); font-size:14px; font-style:italic;"></p>
        <div id="modalDishAllergens" class="allergen-box" style="display:none;"></div>
        <div id="modalLoading" style="text-align:center; padding:16px; color:#38bdf8; display:none;">Kargatzen osagaiak...</div>
        <div id="modalIngredientsList"></div>
        <button class="btn-action" style="background:#334155; color:white; width:100%; margin-top:8px;" onclick="itxiOsagaiakModal()">
          Itxi
        </button>
      </div>
    </div>

    <footer>
      <span
        >Sukaldea KDS · Philips 32BDL3751T Pantaila Taktila (Full HD · Android
        13) | Sakatu plateretan egoera aldatzeko</span
      >
      <span id="apiEndpointText">API: Bilatzen...</span>
    </footer>

    <script>
      function updateClock() {
        const now = new Date();
        document.getElementById("liveClock").textContent =
          now.toLocaleTimeString("eu-ES");
      }
      setInterval(updateClock, 1000);
      updateClock();

      let currentApiBase = null;
      let currentPrestOrders = [];

      function escapeHtml(text) {
        if (!text) return "";
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function getElapsedTime(dateStr) {
        if (!dateStr) return "";
        const orderDate = new Date(dateStr.replace(" ", "T"));
        const now = new Date();
        const diffMs = now - orderDate;
        const diffMins = Math.floor(diffMs / 60000);
        if (isNaN(diffMins) || diffMins < 0)
          return dateStr.substring(11, 16) || "";
        if (diffMins === 0) return "Oraintxe";
        if (diffMins === 1) return "Duela min 1";
        return `Duela ${diffMins} min`;
      }

      function createOrderCardHtml(order) {
        const lerroak = order.lerroak || [];
        const guztiaEginda =
          order.egoera === "Prestatua" ||
          (lerroak.length > 0 &&
            lerroak.every(
              (l) => l.egoera === "Prestatua" || l.egoera === "Zerbitzatua",
            ));
        const mahaiaIzena = order.mahaiZenbakia
          ? `Mahaia ${order.mahaiZenbakia}`
          : order.mahaia || `Eskaera #${order.id}`;
        const denbora = getElapsedTime(order.sortzeData || order.sortze_data);

        return `
        <div class="card" id="order-card-${order.id}">
          <div class="card-header">
            <div>
              <span class="card-table">${mahaiaIzena}</span>
              <span style="font-size:12px; color:var(--text-muted); margin-left:8px;">#${order.id} (${order.langileIzena || "Zerbitzaria"})</span>
            </div>
            <span class="card-time">${denbora}</span>
          </div>
          <ul class="dish-list">
            ${lerroak
              .map((l) => {
                const isPrestatua =
                  l.egoera === "Prestatua" || l.egoera === "Zerbitzatua";
                const isSukaldean = l.egoera === "Sukaldean";
                let btnClass = "dish-btn-zai";
                let btnText = "Sukaldera";
                let hurrengoEgoera = "Sukaldean";

                if (isSukaldean) {
                  btnClass = "dish-btn-martxan";
                  btnText = "Prestatuta";
                  hurrengoEgoera = "Prestatua";
                } else if (isPrestatua) {
                  btnClass = "dish-btn-done";
                  btnText = "✓ Eginda";
                  hurrengoEgoera = "Sukaldean";
                }

                const platerIzenaSafe = escapeHtml(l.platerIzena || l.plater_izena || "Platera");
                const platerId = l.plateraId || l.platera_id || 0;

                return `
                <li class="dish-row ${isPrestatua ? "is-done" : ""}" onclick="erakutsiOsagaiak(${platerId}, '${platerIzenaSafe}', event)">
                  <div class="dish-info">
                    <div class="dish-item">
                      <span class="dish-qty">${l.kantitatea || 1}x</span>
                      <span class="dish-name" title="Klik egin osagaiak eta errezetaren datuak ikusteko">${platerIzenaSafe} <span style="font-size:12px; opacity:0.8;">ℹ️</span></span>
                    </div>
                    ${l.oharrak ? `<div class="dish-notes">📝 ${escapeHtml(l.oharrak)}</div>` : ""}
                  </div>
                  <button class="dish-btn ${btnClass}" onclick="updateLineState(${l.id}, '${hurrengoEgoera}', event)">
                    ${btnText}
                  </button>
                </li>
              `;
              })
              .join("")}
          </ul>
          <div class="order-actions">
            ${
              order.egoera === "Irekia"
                ? `
              <button class="btn-action btn-start" onclick="updateOrderState(${order.id}, 'Sukaldean', event)">
                Sukaldera Bidali
              </button>
            `
                : ""
            }
            ${
              guztiaEginda
                ? `
              <button class="btn-action btn-serve" onclick="updateOrderState(${order.id}, 'Zerbitzatua', event)" title="Aterata/Zerbitzatuta markatu eta pantailatik kendu">
                ✓ Aterata (Zerbitzatua)
              </button>
            `
                : `
              <button class="btn-action btn-complete" onclick="updateOrderState(${order.id}, 'Prestatua', event)">
                Eskaera Osoa Eginda
              </button>
            `
            }
            <button class="btn-action btn-delete" onclick="ezabatuEskaera(${order.id}, event)" title="Ezabatu eskaera">
              🗑️
            </button>
          </div>
        </div>
      `;
      }

      function renderOrders(orders) {
        // 1. Filtratu soilik aktiboak (ez kobratuak, ez ezezatuak, ez zerbitzatuak)
        // 2. GARRANTZITSUA: Platerik ez duten eskaera hutsak kanpoan utzi!
        const aktiboak = orders.filter(
          (o) =>
            o.egoera !== "Kobratua" &&
            o.egoera !== "Ezeztatua" &&
            o.egoera !== "Zerbitzatua" &&
            o.ezabatua !== 1 &&
            o.ezabatua !== true &&
            Array.isArray(o.lerroak) &&
            o.lerroak.length > 0,
        );

        // Kategoriak banatu lerroen/eskaeraren egoeraren arabera
        const zai = [];
        const martxan = [];
        const prest = [];

        aktiboak.forEach((order) => {
          const lerroak = order.lerroak || [];
          const allDone = lerroak.every(
            (l) => l.egoera === "Prestatua" || l.egoera === "Zerbitzatua",
          );
          const anyMartxan = lerroak.some((l) => l.egoera === "Sukaldean");

          if (allDone || order.egoera === "Prestatua") {
            prest.push(order);
          } else if (anyMartxan || order.egoera === "Sukaldean") {
            martxan.push(order);
          } else {
            zai.push(order);
          }
        });

        currentPrestOrders = prest;

        document.getElementById("countZai").textContent = zai.length;
        document.getElementById("countMartxan").textContent = martxan.length;
        document.getElementById("countPrest").textContent = prest.length;

        document.getElementById("listZai").innerHTML = zai.length
          ? zai.map(createOrderCardHtml).join("")
          : '<div class="empty-state">Ez dago eskaerarik zai</div>';
        document.getElementById("listMartxan").innerHTML = martxan.length
          ? martxan.map(createOrderCardHtml).join("")
          : '<div class="empty-state">Ez dago eskaerarik martxan</div>';
        document.getElementById("listPrest").innerHTML = prest.length
          ? prest.map(createOrderCardHtml).join("")
          : '<div class="empty-state">Ez dago eskaerarik prestatuta</div>';
      }

      async function updateLineState(lineId, newEgoera, event) {
        if (event) event.stopPropagation();
        if (!currentApiBase) return;
        try {
          const res = await fetch(
            `${currentApiBase}/eskaerak/lerroak/${lineId}/egoera`,
            {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ egoera: newEgoera }),
            },
          );
          if (res.ok) {
            loadOrdersFromApi();
          } else {
            console.error("Errorea lerroa aldatzean", await res.text());
          }
        } catch (err) {
          console.error("Fetch errorea:", err);
        }
      }

      async function updateOrderState(orderId, newEgoera, event) {
        if (event) event.stopPropagation();
        if (!currentApiBase) return;
        try {
          let res;
          if (newEgoera === "Sukaldean") {
            res = await fetch(`${currentApiBase}/eskaerak/${orderId}/sukaldera`, {
              method: "POST",
            });
          } else {
            res = await fetch(`${currentApiBase}/eskaerak/${orderId}/egoera`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ egoera: newEgoera }),
            });
          }
          if (res && res.ok) {
            loadOrdersFromApi();
          } else if (res) {
            console.error("Errorea eskaera aldatzean:", await res.text());
          }
        } catch (err) {
          console.error("Fetch errorea eskaera aldatzean:", err);
        }
      }

      async function ezabatuEskaera(orderId, event) {
        if (event) event.stopPropagation();
        if (!confirm(`#${orderId} eskaera ezabatu nahi duzu?`)) return;
        if (!currentApiBase) return;
        try {
          const res = await fetch(`${currentApiBase}/eskaerak/${orderId}`, {
            method: "DELETE",
          });
          if (res.ok) {
            loadOrdersFromApi();
          } else {
            alert("Errorea eskaera ezabatzean: " + (await res.text()));
          }
        } catch (err) {
          console.error("Errorea eskaera ezabatzean:", err);
        }
      }

      async function garbituPrestatutakoak(event) {
        if (event) event.stopPropagation();
        if (!currentPrestOrders || currentPrestOrders.length === 0) {
          alert("Ez dago eskaera prestatutarik garbitzeko.");
          return;
        }
        if (
          !confirm(
            `Ziur zaude prestatuta dauden ${currentPrestOrders.length} eskaera guztiak aterata bezala markatu eta pantailatik kendu nahi dituzula?`,
          )
        )
          return;

        for (const o of currentPrestOrders) {
          try {
            await fetch(`${currentApiBase}/eskaerak/${o.id}/egoera`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ egoera: "Zerbitzatua" }),
            });
          } catch (e) {
            console.error("Errorea garbitzean:", e);
          }
        }
        loadOrdersFromApi();
      }

      async function erakutsiOsagaiak(platerId, platerIzena, event) {
        if (event) event.stopPropagation();
        if (!platerId || !currentApiBase) return;

        const modal = document.getElementById("ingredientsModal");
        const modalTitle = document.getElementById("modalDishTitle");
        const modalCategory = document.getElementById("modalDishCategory");
        const modalDesc = document.getElementById("modalDishDesc");
        const modalAllergens = document.getElementById("modalDishAllergens");
        const modalIngredientsList = document.getElementById("modalIngredientsList");
        const modalLoading = document.getElementById("modalLoading");

        modalTitle.textContent = platerIzena;
        modalCategory.textContent = "Kargatzen...";
        modalDesc.textContent = "";
        modalAllergens.style.display = "none";
        modalIngredientsList.innerHTML = "";
        modalLoading.style.display = "block";
        modal.classList.add("active");

        try {
          const [detailRes, eskandalloRes] = await Promise.all([
            fetch(`${currentApiBase}/platerak/${platerId}`).then(r => r.ok ? r.json() : null).catch(() => null),
            fetch(`${currentApiBase}/platerak/${platerId}/eskandalloa`).then(r => r.ok ? r.json() : null).catch(() => null)
          ]);

          modalLoading.style.display = "none";

          if (detailRes && detailRes.data) {
            const p = detailRes.data;
            modalCategory.textContent = p.kategoria || "Orokorra";
            modalDesc.textContent = p.deskribapena || "Ez dago deskribapenik erregistratuta.";
            if (p.alergenoak && p.alergenoak.trim()) {
              modalAllergens.style.display = "block";
              modalAllergens.style.background = "rgba(239, 68, 68, 0.15)";
              modalAllergens.style.borderColor = "#ef4444";
              modalAllergens.style.color = "#fca5a5";
              modalAllergens.innerHTML = `⚠️ <strong>Alergenoak:</strong> ${p.alergenoak}`;
            } else {
              modalAllergens.style.display = "block";
              modalAllergens.style.background = "rgba(16, 185, 129, 0.15)";
              modalAllergens.style.borderColor = "#10b981";
              modalAllergens.style.color = "#6ee7b7";
              modalAllergens.innerHTML = `✓ <strong>Alergenorik gabe</strong>`;
            }
          } else {
            modalCategory.textContent = "Platera";
          }

          const osagaiak = (eskandalloRes && eskandalloRes.data && eskandalloRes.data.osagaiak) ? eskandalloRes.data.osagaiak : [];
          if (osagaiak.length > 0) {
            modalIngredientsList.innerHTML = `
              <div style="font-weight:700; margin-bottom:8px; color:#94a3b8; font-size:14px; text-transform:uppercase;">
                Errezetaren Osagaiak (${osagaiak.length}):
              </div>
              ${osagaiak.map(o => `
                <div class="ingredient-item">
                  <span style="font-weight:600; color:#f1f5f9;">🍴 ${o.lehengaiaIzena}</span>
                  <span style="background:#0284c7; color:white; padding:3px 8px; border-radius:4px; font-size:13px; font-weight:bold;">
                    ${o.kantitatea} ${o.unitatea}
                  </span>
                </div>
              `).join("")}
            `;
          } else {
            modalIngredientsList.innerHTML = `<div class="empty-state" style="padding:16px;">Ez dago osagairik erregistratuta plater honen errezetan.</div>`;
          }
        } catch (err) {
          modalLoading.style.display = "none";
          modalIngredientsList.innerHTML = `<div style="color:#ef4444; padding:12px;">Errorea osagaiak kargatzean: ${err.message}</div>`;
        }
      }

      function itxiOsagaiakModal() {
        const modal = document.getElementById("ingredientsModal");
        if (modal) modal.classList.remove("active");
      }

      // ESC sakatzean modala itxi
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") itxiOsagaiakModal();
      });

      async function loadOrdersFromApi() {
        const banner = document.getElementById("dbAlertBanner");
        const dot = document.getElementById("statusDot");
        const txt = document.getElementById("statusText");
        const apiHost = window.location.hostname || "localhost";

        // Posible API helbideak (5050 docker bidez, 5000 zuzenean)
        const candidates = [
          { base: `http://${apiHost}:5050/api/v1`, health: `http://${apiHost}:5050/health` },
          { base: `http://${apiHost}:5000/api/v1`, health: `http://${apiHost}:5000/health` }
        ];

        for (const cand of candidates) {
          try {
            // 1. Health egiaztatu: APIa eta DB egoera banatuta detektatzeko
            const healthRes = await fetch(cand.health, { cache: "no-store" });
            const isApiAlive = healthRes.status === 200 || healthRes.status === 503;

            if (isApiAlive) {
              currentApiBase = cand.base;
              document.getElementById("apiEndpointText").textContent = `API: ${cand.base}`;

              if (healthRes.status === 503) {
                // APIa piztuta dago, baina Datu-Basea deskonektatuta!
                dot.style.background = "var(--warning)";
                txt.textContent = "API martxan, datu basea deskonektatuta";
                if (banner) {
                  banner.style.display = "block";
                  banner.style.background = "#b45309";
                  banner.style.borderColor = "#f59e0b";
                  banner.textContent = "ADI: REST APIa martxan dago, baina MySQL datu-basea deskonektatuta dago!";
                }
                renderOrders([]);
                return;
              }

              // healthRes.status === 200 -> API eta DB biak martxan
              dot.style.background = "var(--success)";
              txt.textContent = "Konektatuta";
              if (banner) banner.style.display = "none";

              // Eskaerak kargatu
              const res = await fetch(`${cand.base}/eskaerak`, { cache: "no-store" });
              if (res.ok) {
                const json = await res.json();
                const list = json.dataList || json.valueList || json.data || [];

                // Xehetasunak (lerroak) kargatu eskaera bakoitzarentzat
                const fullOrders = await Promise.all(
                  list.map(async (item) => {
                    try {
                      const detailRes = await fetch(
                        `${cand.base}/eskaerak/${item.id}`,
                        { cache: "no-store" }
                      );
                      if (detailRes.ok) {
                        const detailJson = await detailRes.json();
                        return detailJson.data || item;
                      }
                    } catch (_) {}
                    return item;
                  })
                );

                renderOrders(fullOrders);
              }
              return;
            }
          } catch (e) {
            // Saiatu hurrengo portuarekin
          }
        }

        // APIra batere ezin bada konektatu
        dot.style.background = "var(--accent)";
        txt.textContent = "API Deskonektatuta";
        if (banner) {
          banner.style.display = "block";
          banner.style.background = "#991b1b";
          banner.style.borderColor = "#ef4444";
          banner.textContent =
            "OHARRA: REST API zerbitzariarekin ezin izan da konektatu (Portua 5050 / 5000). Egiaztatu martxan dagoela!";
        }
      }

      loadOrdersFromApi();
      setInterval(loadOrdersFromApi, 4000);
    </script>
  </body>
</html>
