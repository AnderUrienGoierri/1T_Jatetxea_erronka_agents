services:
  jatetxea-db:
    image: mysql:8.0
    container_name: jatetxea_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jatetxea_db
    ports:
      # 3308 portua erabiltzen dugu (3306 Windows zerbitzuak eta 3307 beste edukiontzi batek hartuta dutelako)
      - "3308:3306"
    volumes:
      - jatetxea_db_data:/var/lib/mysql
      # Hasieratze scripta: kontainerra lehen aldiz altxatzean automatikoki exekutatzen du schema osoa!
      - ./espezifikazioak/datu_basea_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci

volumes:
  jatetxea_db_data:
