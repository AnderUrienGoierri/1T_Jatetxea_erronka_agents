<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%">
  <defs>
    <!-- Urre koloreko gradientea ertzerako -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Barnealdeko ardo-iluneko gradientea -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#9f1239"/>
      <stop offset="55%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </radialGradient>

    <!-- Itzala txaparako -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Testuaren itzala -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Kanpoko eraztuna eta atzeko kaxa -->
  <g filter="url(#badgeShadow)">
    <!-- Oinarrizko zirkulu zilar-urrezkoa -->
    <circle cx="70" cy="70" r="62" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5"/>
    <!-- Barneko disko nagusia -->
    <circle cx="70" cy="70" r="56" fill="url(#bgGrad)"/>
    <!-- Barneko ertz fin apaingarria -->
    <circle cx="70" cy="70" r="52" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3,2"/>
  </g>

  <!-- Goiko gastronomia-ikurra (Koroa / Sukaldari ukitua) -->
  <g fill="url(#goldGrad)" transform="translate(0, -2)">
    <path d="M 64 28 C 66 24, 74 24, 76 28 C 77 30, 72 32, 70 34 C 68 32, 63 30, 64 28 Z"/>
    <circle cx="56" cy="33" r="2.5"/>
    <circle cx="70" cy="27" r="3"/>
    <circle cx="84" cy="33" r="2.5"/>
    <path d="M 54 36 Q 70 39 86 36 Q 70 41 54 36 Z"/>
  </g>

  <!-- Tipografia Nagusia: T1 -->
  <!-- T letra -->
  <text x="52" y="82"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Cinzel', 'Playfair Display', Georgia, serif"
        font-size="44"
        font-weight="900"
        fill="#ffffff"
        text-anchor="middle"
        filter="url(#textShadow)"
        letter-spacing="-1">T</text>

  <!-- 1 zenbakia urre-ukituarekin -->
  <text x="86" y="82"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Cinzel', 'Playfair Display', Georgia, serif"
        font-size="44"
        font-weight="900"
        fill="url(#goldGrad)"
        text-anchor="middle"
        filter="url(#textShadow)"
        letter-spacing="-1">1</text>

  <!-- Erdiko lerro apaingarria -->
  <line x1="38" y1="92" x2="102" y2="92" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="70" cy="92" r="2.5" fill="#ffffff"/>

  <!-- Beheko testua: JATETXEA -->
  <text x="70" y="105"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="9"
        font-weight="700"
        fill="#f8fafc"
        text-anchor="middle"
        letter-spacing="2.5">JATETXEA</text>
</svg>

