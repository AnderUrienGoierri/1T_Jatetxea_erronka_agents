<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120">
  <defs>
    <linearGradient id="ardoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9F1239" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="urreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- ISOTIPOA (EZKERREAN) -->
  <g transform="translate(15, 10)">
    <!-- Oinarrizko zirkulua -->
    <circle cx="50" cy="50" r="46" fill="url(#ardoGrad)" stroke="#FCD34D" stroke-width="2.5" />
    <circle cx="50" cy="50" r="41" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- T1 Testua -->
    <text x="50" y="60" font-family="'Segoe UI', 'Cinzel', 'Georgia', serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">T1</text>
    
    <!-- Koroa / Adar sinbolikoa (Oliba & Haritza) -->
    <path d="M 32 75 Q 50 83 68 75" fill="none" stroke="url(#urreGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="43" cy="78" r="2.8" fill="#15803D" />
    <circle cx="57" cy="78" r="2.8" fill="#15803D" />
  </g>

  <!-- LOGOTIPOA (ESKUINEAN) -->
  <g transform="translate(135, 18)">
    <!-- Titulu Nagusia -->
    <text x="0" y="42" font-family="'Segoe UI', 'Cinzel', 'Georgia', serif" font-size="34" font-weight="800" fill="#881337" letter-spacing="1.5">T1 JATETXEA</text>
    
    <!-- Azpititulua: Italo-Euskaldun kontzeptua -->
    <text x="2" y="66" font-family="'Segoe UI', 'Inter', sans-serif" font-size="12" font-weight="700" fill="#15803D" letter-spacing="3.5">OSTERIA &amp; PARRILLA</text>
    
    <!-- Marra banatzaile urreztatua -->
    <rect x="2" y="74" width="230" height="2.5" fill="url(#urreGrad)" rx="1.2" />
    
    <!-- Xehetasuna -->
    <text x="2" y="92" font-family="'Segoe UI', 'Inter', sans-serif" font-size="10.5" font-style="italic" fill="#64748B">Euskal Herria &amp; Italia · Sukalde Tradizionala</text>
  </g>
</svg>

